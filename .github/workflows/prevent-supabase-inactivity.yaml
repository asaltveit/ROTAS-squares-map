name: Prevent Supabase Inactivity

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs at midnight every Sunday

jobs:
  ping-database:
    runs-on: ubuntu-latest
    environment: Production
    env:
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Make an API request to Supabase
        run: |
          curl -X GET "https://roslvahbgkokyokgiphb.supabase.co/rest/v1/" \
          -H "apikey: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
          -H "Authorization: Bearer ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}"